[package]
name = "cc-monitor"
version = "0.1.0"
description = "CC Monitor - Tauri desktop app for monitoring Claude Code instances"
authors = ["you"]
edition = "2021"

[lib]
name = "cc_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "sync", "macros"] }
sysinfo = "0.30"
regex = "1"
once_cell = "1"
strip-ansi-escapes = "0.2"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
